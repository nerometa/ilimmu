name: checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: ci-only-ephemeral-database
          POSTGRES_DB: companion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://companion:ci-only-ephemeral-database@127.0.0.1:5432/companion
      BETTER_AUTH_SECRET: ci-only-ephemeral-session-secret-not-for-deployment
      BETTER_AUTH_URL: http://127.0.0.1:4173
      ORIGIN: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
      - run: bun run build-storybook
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run test:storybook
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
